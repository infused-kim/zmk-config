manifest:
  # ZMK and all modules that publish matching release tags use this revision.
  #
  # When upgrading ZMK, update these three places together:
  #   1. `revision` below
  #   2. the `@<ref>` of build-user-config.yml in .github/workflows/build.yml
  #   3. the `zephyr-sdk` version in mise.toml (see the comment there for how
  #      to find the right one)
  defaults:
    revision: v0.3

  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: infused-kim
      url-base: https://github.com/infused-kim
    - name: urob
      url-base: https://github.com/urob
    - name: badjeff
      url-base: https://github.com/badjeff/

  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml


    #
    # Additional zmk modules
    #

    # Module for PS/2 mouse & TP driver
    # Disabled until it is ported to upstream pointing / input processors.
    # Also re-enable HAS_MOUSE_TP in think_corney.keymap and THINK_CORNEY_PS2
    # in think_corney_right.overlay.
    # - name: kb_zmk_ps2_mouse_trackpoint_driver
    #   remote: infused-kim
    #   revision: dev/2024-04-acceleration

    # zmk module for nice_peri_view
    - name: tmp-npv
      remote: infused-kim
      revision: main

    # Urob's zmk helpers that contain key position defines
    - name: zmk-helpers
      remote: urob

    # Tri-state behavior to make cmd+tab switching key
    - name: zmk-tri-state
      remote: urob

  self:
    path: config
