# keymap-drawer config, used by `just draw`.
#
# Only settings that differ from keymap-drawer's defaults belong here. See
# `keymap dump-config` for the defaults and
# https://github.com/caksoylar/keymap-drawer/blob/main/CONFIGURATION.md
# for all options.

draw_config:
  # Follow the viewer's light/dark mode (e.g. GitHub's theme in the README)
  dark_mode: auto

parse_config:
  # Resolves `#include "zmk-helpers/..."` (key position labels like LT1).
  # Relative to the repo root, where `just draw` runs. Needs `just init`.
  zmk_additional_includes:
    - .zmk/zmk-helpers/include

  # Leave transparent keys blank instead of showing ▽
  trans_legend: {t: '', type: trans}

  # Draw modifier functions like LG(Q) as ⌘Q instead of Gui+Q
  modifier_fn_map:
    left_ctrl: ⌃
    right_ctrl: ⌃
    left_shift: ⇧
    right_shift: ⇧
    left_alt: ⎇
    right_alt: ⎇
    left_gui: ⌘
    right_gui: ⌘
    keycode_combiner: '{mods}{key}'
    mod_combiner: '{mod_1}{mod_2}'

  # Exact bindings, mostly custom behaviors from config/includes/
  raw_binding_map:
    '&mm_shift_caps_word_l': {t: '⇧', s: ' ', h: ' '}
    '&mm_shift_caps_word_r': {t: '⇧', s: ' ', h: ' '}
    '&mm_bspc_del': {t: '⌫', s: '⌦'}
    '&mm_grescm_gui': {t: ⎋, h: ⌘, s: '~ `'}
    '&mm_spc_unds_layer': {t: '⎵', h: 'SYM', s: '_ -'}
    '&mm_plus_minus': {t: '+', s: '-'}
    '&mm_grave_caret': {t: '`', s: '^'}
    '&mm_bracket_r': {t: '(', s: ')'}
    '&mm_comma_semi_meh': {t: ',', s: ';', h: 'MEH'}
    '&mm_dot_colon': {t: '.', s: ':'}
    '&mm_none_undo': ''
    '&mm_left_word_cut': '↞'
    '&mm_up_save': '↑'
    '&mm_down_copy': '↓'
    '&mm_none_paste': ''
    '&mm_1_cut': '1'
    '&mm_2_copy': '2'
    '&mm_5_save': '5'
    '&swapper_cmd_tab': {t: '⌘↹'}
    '&td_at_email': {t: '@'}
    '&num_word': 'NUM'
    '&nav_word': 'NAV'
    '&caps_word_capslock': "Caps\nWord"
    '&caps_word': '⇪'
    '&td_shift_l': '⇧'
    '&td_shift_r': '⇧'
    '&td_nav_layer': {t: '⏎', h: 'NAV'}
    '&m_type_md_code_block': '```'
    '&kt LSHFT': "⇧\nLock"
    # These match layer numbers from base.keymap and need updating if the
    # layers are reordered.
    '&num_word 6': {t: "Num\nWord", h: ""}
    '&lt_num_word 4 0': {t: "Num\nWord", h: ''}
    '&ltog LGUI 5': {t: "Cancel\nNav", h: '⌘'}
    '&ltog LGUI 6': {t: "Cancel\nNum", h: '⌘'}
    '&ltog LGUI 7': {t: "Cancel\nSym", h: '⌘'}
    '&ltog LGUI 8': {t: "Cancel\nFunc", h: '⌘'}
    '&ltog LGUI 9': {t: "Cancel\nAdjust", h: '⌘'}
    '&ltog LGUI 11': {t: "Cancel\nMouse", h: '⌘'}

    # Mouse keys
    '&mkp LCLK': {t: LMB, h: click}
    '&mkp RCLK': {t: RMB, h: click}
    '&mkp MCLK': {t: MMB, h: click}
    '&mmv MOVE_UP': {t: '↑', h: move}
    '&mmv MOVE_DOWN': {t: '↓', h: move}
    '&mmv MOVE_LEFT': {t: '←', h: move}
    '&mmv MOVE_RIGHT': {t: '→', h: move}
    '&msc SCRL_UP': {t: '↑', h: scroll}
    '&msc SCRL_DOWN': {t: '↓', h: scroll}

  # Keycode legends. Setting this replaces keymap-drawer's default map instead
  # of extending it, so the defaults are repeated at the end.
  zmk_keycode_map:
    # Editing and navigation
    SPACE: ⎵
    BSPC: ⌫
    DEL: ⌦
    TAB: ↹
    RETURN: ⏎
    ESCAPE: ⎋
    LEFT: ←
    RIGHT: →
    UP: ↑
    DOWN: ↓
    LA(LEFT): ↞
    LA(RIGHT): ↠
    LG(LEFT): ⇤
    LG(RIGHT): ⇥

    # Symbols with their shifted variant
    BACKSLASH: {t: '\', s: '|'}
    COMMA: {t: ',', s: '<'}
    DOT: {t: '.', s: '>'}
    EQUAL: {t: '=', s: '+'}
    GRAVE: {t: '`', s: '~'}
    LBKT: {t: '[', s: '{'}
    RBKT: {t: ']', s: '}'}
    MINUS: {t: '-', s: '_'}
    SEMI: {t: ';', s: ':'}
    SEMICOLON: {t: ';', s: ':'}
    SINGLE_QUOTE: {t: '''', s: '"'}
    SLASH: {t: '/', s: '?'}

    # Modifiers
    LCTRL: ⌃
    RCTRL: ⌃
    LEFT_CONTROL: ⌃
    RIGHT_CONTROL: ⌃
    LSHFT: ⇧
    RSHFT: ⇧
    LEFT_SHFT: ⇧
    RIGHT_SHFT: ⇧
    LALT: ⎇
    RALT: ⎇
    LEFT_ALT: ⎇
    RIGHT_ALT: ⎇
    LGUI: ⌘
    RGUI: ⌘
    LEFT_GUI: ⌘
    RIGHT_GUI: ⌘

    # Media
    C_REWIND: ⏮
    C_FAST_FORWARD: ⏭
    C_PAUSE: ⏯
    C_MUTE: "VOL\nMUTE"
    C_VOLUME_DOWN: "VOL\nDOWN"
    C_VOLUME_UP: "VOL\nUP"
    C_BRIGHTNESS_DEC: ☀↓
    C_BRIGHTNESS_INC: ☀↑

    # Hyper, Meh (MY_HYPER / MY_MEH in custom_keycodes.dtsi) and shortcuts
    # that modifier_fn_map doesn't draw as intended
    LS(LC(LG(LALT))): HYPER
    RS(RC(RG(RALT))): HYPER
    LC(LG(LALT)): MEH
    RC(RG(RALT)): MEH
    LG(GRAVE): ⌘`

    # keymap-drawer's defaults (v0.23.0) for everything not set above
    EXCLAMATION: '!'
    EXCL: '!'
    AT_SIGN: '@'
    AT: '@'
    HASH: '#'
    POUND: '#'
    DOLLAR: $
    DLLR: $
    PERCENT: '%'
    PRCNT: '%'
    CARET: ^
    AMPERSAND: '&'
    AMPS: '&'
    ASTERISK: '*'
    ASTRK: '*'
    STAR: '*'
    LEFT_PARENTHESIS: (
    LPAR: (
    RIGHT_PARENTHESIS: )
    RPAR: )
    PLUS: +
    UNDERSCORE: _
    UNDER: _
    FSLH: /
    QUESTION: '?'
    QMARK: '?'
    BSLH: \
    PIPE: '|'
    NON_US_BACKSLASH: \
    PIPE2: '|'
    NON_US_BSLH: '|'
    COLON: ':'
    SQT: ''''
    APOSTROPHE: ''''
    APOS: ''''
    DOUBLE_QUOTES: '"'
    DQT: '"'
    LESS_THAN: <
    LT: <
    PERIOD: .
    GREATER_THAN: '>'
    GT: '>'
    LEFT_BRACKET: '['
    LEFT_BRACE: '{'
    LBRC: '{'
    RIGHT_BRACKET: ']'
    RIGHT_BRACE: '}'
    RBRC: '}'
    TILDE: '~'
    NON_US_HASH: '#'
    NUHS: '#'
    TILDE2: '~'

  # Combo placement, by combo node name in config/includes/combos.dtsi
  zmk_combos:
    # Plain legends: LBKT/RBKT above also define a shifted variant, which
    # combos would otherwise show as well
    combo_bracket_v_square_l: {k: '['}
    combo_bracket_v_square_r: {k: ']'}
    # Slide the box toward the lower key so it doesn't cover the home row
    # mod legend (higher values start covering the lower key's letter)
    combo_bracket_v_angled_l: {s: 0.3}
    combo_bracket_v_angled_r: {s: 0.3}
    combo_tog_nav_word: {a: bottom, o: 0.05}
    combo_tog_num_word: {a: bottom, o: 0.25}
    combo_return: {a: bottom, o: 0.3}
    combo_capsword: {k: "Caps\nWord"}
    combo_tog_mouse_keys_l: {a: bottom, o: 2}
    combo_tog_mouse_keys_r: {a: bottom, o: 2}
